apiVersion: v1
kind: Service
metadata:
  name: oficina-api
spec:
  # Porta fixa: o NLB do tech-challenge-infra-k8s aponta para a 30080 (ADR-005).
  type: NodePort
  selector:
    app.kubernetes.io/name: oficina-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
