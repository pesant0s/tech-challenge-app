# Desenvolvimento local, com hot-reload. Produção roda no EKS.
services:
  api:
    build: .
    container_name: oficina-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PYTHONPATH: /app
      LOG_FORMAT: console
    volumes:
      - .:/app
      - /app/.venv
      - /app/__pycache__
    entrypoint: ["sh", "-c"]
    command:
      - |
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload \
          --reload-exclude '**/.venv*/**' \
          --reload-exclude '**/__pycache__/**' \
          --reload-exclude '**/tests/**'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: oficina-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oficina}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
